<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portofolio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1115; color: #e8eaed;
    line-height: 1.6; padding: 24px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { padding: 48px 0 32px; }
  h1 { font-size: 32px; letter-spacing: -0.5px; }
  .peran { color: #8ab4f8; font-weight: 600; margin-top: 4px; }
  .tentang { margin-top: 16px; color: #a8adb7; }
  h2 { font-size: 18px; margin: 32px 0 12px; }
  .proyek {
    background: #171a21; border: 1px solid #242832;
    border-radius: 12px; padding: 16px; margin-bottom: 12px;
  }
  .proyek h3 { font-size: 16px; }
  .proyek p { color: #a8adb7; font-size: 14px; margin-top: 4px; }
  a { color: #8ab4f8; text-decoration: none; }
  footer { margin: 48px 0 24px; font-size: 13px; color: #6b7280; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>WannDesign</h1>
      <div class="peran">Web Developer</div>
      <p class="tentang">Saya suka membuat website yang rapi dan mudah dipakai.</p>
    </header>

    <h2>Proyek</h2>
    <div class="proyek">
      <h3>Proyek Pertama</h3>
      <p>Deskripsi singkat proyek ini.</p>
      <p><a href="#">Lihat</a></p>
    </div>
    <div class="proyek">
      <h3>Proyek Kedua</h3>
      <p>Deskripsi singkat proyek ini.</p>
      <p><a href="#">Lihat</a></p>
    </div>

    <footer>© 2026 WannDesign</footer>
  </div>
</body>
</html>
